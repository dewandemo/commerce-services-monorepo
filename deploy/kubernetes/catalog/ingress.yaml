apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: catalog.demo.local
      http:
        paths:
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8080
