apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: orders.demo.local
      http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  number: 8081
